{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Learning | Welcome</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; min-height: 100%; }
        body {
            background: #eef0ff;
            overflow-x: hidden;
        }
        .reference-ui {
            position: relative;
            width: 100%;
            line-height: 0;
            overflow: hidden;
        }
        .reference-ui img {
            display: block;
            width: 100%;
            height: auto;
            user-select: none;
            -webkit-user-drag: none;
        }
        .ui-link {
            position: absolute;
            display: block;
            z-index: 2;
            border-radius: 999px;
            outline: none;
        }
        .ui-link:focus-visible {
            box-shadow: 0 0 0 4px rgba(81, 93, 255, .55);
        }
        /* Exact hit areas over the Login/Register controls in the supplied reference. */
        .login-main {
            left: 46.15%;
            top: 55.20%;
            width: 20.55%;
            height: 6.15%;
        }
        .register-main {
            left: 73.37%;
            top: 55.20%;
            width: 20.67%;
            height: 6.15%;
        }
        .register-inline {
            left: 58.8%;
            top: 65.15%;
            width: 9.5%;
            height: 3.0%;
        }
        .login-inline {
            left: 88.4%;
            top: 65.15%;
            width: 5.0%;
            height: 3.0%;
        }
    </style>
</head>
<body>
    <main class="reference-ui" aria-label="Smart Learning landing page">
        <img
            src="{% static 'images/landing_reference.png' %}"
            alt="Smart Learning Through Tunes & Cartoons landing page"
        >

        <a
            href="{% url 'accounts:login' %}"
            class="ui-link login-main"
            aria-label="Login"
            title="Login"
        ></a>

        <a
            href="{% url 'accounts:register' %}"
            class="ui-link register-main"
            aria-label="Register"
            title="Register"
        ></a>

        <a
            href="{% url 'accounts:register' %}"
            class="ui-link register-inline"
            aria-label="Register Now"
            title="Register Now"
        ></a>

        <a
            href="{% url 'accounts:login' %}"
            class="ui-link login-inline"
            aria-label="Login"
            title="Login"
        ></a>
    </main>
</body>
</html>
