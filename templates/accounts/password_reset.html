<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Smart Learning</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, #172b85 0%, transparent 35%),
                radial-gradient(circle at 80% 70%, #32127a 0%, transparent 35%),
                #02052b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            padding: 45px;
            border-radius: 28px;
            background: rgba(8, 16, 75, .92);
            border: 1px solid #2343b8;
            box-shadow: 0 0 50px rgba(40, 80, 255, .25);
        }

        .logo {
            font-size: 42px;
            text-align: center;
        }

        h1 {
            text-align: center;
            margin: 15px 0 10px;
            font-size: 34px;
        }

        p {
            text-align: center;
            color: #aeb9dc;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 25px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #3155c9;
            background: #07134e;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 16px;
            border: 0;
            border-radius: 14px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(90deg, #7925ff, #087cff);
        }

        a {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #18bfff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">📖🎵</div>

    <h1>Forgot Password?</h1>

    <p>
        Enter your registered email address and we'll help you
        reset your password.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.email.label_tag }}
        {{ form.email }}

        <button type="submit">
            Send Reset Link →
        </button>
    </form>

    <a href="{% url 'accounts:login' %}">
        ← Back to Login
    </a>

</div>

</body>
</html>
